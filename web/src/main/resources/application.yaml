spring:
  application:
    name: book-catalog

  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: catalog-pool
      maximum-pool-size: 10

  h2:
    console:
      enabled: true
      path: /h2-console

    thymeleaf:
      cache: false
      prefix: classpath:/templates/
      suffix: .html
      mode: HTML
      encoding: UTF-8

    messages:
      basename: messages
      encoding: UTF-8
      fallback-to-system-locale: false

    web:
      locale: uk
      locale-resolver: accept-header

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

catalog:
  app-name: Book Catalog
  version: 1.0.0
  page:
    default-size: 20
    max-size: 100

logging:
  level:
    root: INFO
    catalog: DEBUG
    org.springframework: WARN
    org.springframework.web: INFO