spring:
  application:
    name: book-catalog

  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: catalog-pool
      maximum-pool-size: 10
      minimum-idle: 2

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

catalog:
  app-name: Book Catalog
  version: 1.0.0
  page:
    default-size: 20
    max-size: 100
  comment:
    edit-window-hours: 24

logging:
  level:
    root: INFO
    catalog: DEBUG
    org.springframework: WARN
    org.springframework.web: INFO
    org.h2: WARN
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"