spring:
  application:
    name: book-catalog

  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: catalog-pool
      maximum-pool-size: 10

  h2:
    console:
      enabled: true
      path: /h2-console

    thymeleaf:
      cache: false
      prefix: classpath:/templates/
      suffix: .html
      mode: HTML
      encoding: UTF-8

    messages:
      basename: messages
      encoding: UTF-8
      fallback-to-system-locale: false

    web:
      locale: uk
      locale-resolver: accept-header
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: b3e7782cd9fcaa
    password: 8cf33773db432f
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

    freemarker:
      template-loader-path: classpath:/mail-templates/
      charset: UTF-8
      suffix: .ftl
      cache: false
      check-template-location: true
app:
  mail:
    recipient: sandbox.smtp.mailtrap.io
    sender: bookapp@erlkonig.sumdu.edu.ua


server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

catalog:
  app-name: Book Catalog
  version: 1.0.0
  page:
    default-size: 20
    max-size: 100

logging:
  level:
    root: INFO
    catalog: DEBUG
    org.springframework: WARN
    org.springframework.web: INFO