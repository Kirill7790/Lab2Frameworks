<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="header">
    <h1 th:text="#{app.title}">Book Catalog</h1>

    <div sec:authorize="isAuthenticated()">
        Ви увійшли як <b sec:authentication="name">user</b>.
        (<span sec:authentication="authorities">ROLE</span>)
    </div>

    <nav>
        <a th:href="@{/books}" th:text="#{nav.books}">Books</a>
        |
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/books/add}"
           th:text="#{nav.add}">Add book</a>
        <span sec:authorize="hasRole('ADMIN')"> | </span>

        <a th:href="@{/books(lang='uk')}">🇺🇦 UK</a>
        <a th:href="@{/books(lang='en')}">🇬🇧 EN</a>

        <span sec:authorize="isAuthenticated()"> | </span>
        <form sec:authorize="isAuthenticated()"
              th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:none;border:none;color:#0066cc;cursor:pointer;">
                Вийти
            </button>
        </form>

        <span sec:authorize="!isAuthenticated()"> | </span>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Увійти</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/register}">Реєстрація</a>
    </nav>
    <hr/>
</header>

</body>
</html>
