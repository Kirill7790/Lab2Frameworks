<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}">Book</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; }
        .book-meta { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .comments { margin-top: 20px; }
        .comment { border-left: 3px solid #0066cc; padding-left: 10px; margin-bottom: 15px; background: #fafafa; padding: 10px; }
        .comment-author { font-weight: bold; color: #333; }
        .comment-date { color: #888; font-size: 0.85em; margin-bottom: 5px; }
        .empty { color: #888; font-style: italic; }
        .form-group { margin-bottom: 15px; }
        textarea { width: 100%; height: 80px; padding: 8px; box-sizing: border-box; }
        select { padding: 8px; width: 100%; max-width: 300px; }
        button { padding: 10px 20px; background-color: #0066cc; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #004c99; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h2 th:text="${book.title}">Title</h2>

<div class="book-meta">
    <p><b th:text="#{form.author}">Author</b>:
        <span th:text="${book.author}">Author</span></p>
    <p><b>Рік видання</b>:
        <span th:text="${book.year} ?: '—'">Year</span></p>
</div>

<h3>Коментарі</h3>

<p th:if="${#lists.isEmpty(comments)}" class="empty">До цієї книги ще немає коментарів.</p>

<div class="comments" th:unless="${#lists.isEmpty(comments)}">
    <div th:each="c : ${comments}" class="comment">
        <!-- Оскільки в JPA CommentEntity має поле user, виводимо ім'я через c.user.username -->
        <div class="comment-author" th:text="${c.username}">User</div>
        <div class="comment-date" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">
            Date
        </div>
        <div th:text="${c.text}">Text</div>
    </div>
</div>

<hr style="margin: 30px 0;">

<h3>Залишити коментар</h3>

<!-- Форма додавання коментаря -->
<!-- Передаємо book.id у URL, а userId - через параметр форми -->
<form th:action="@{/books/{id}/comments(id=${book.id})}" method="post">

    <div class="form-group">
        <label for="userId"><b>Оберіть користувача:</b></label>
        <select name="userId" id="userId" required>
            <option value="" disabled selected>-- Виберіть --</option>
            <option th:each="u : ${users}"
                    th:value="${u.id}"
                    th:text="${u.username}">User</option>
        </select>
    </div>

    <div class="form-group">
        <label for="text"><b>Текст коментаря:</b></label>
        <textarea name="text" id="text" required placeholder="Напишіть ваш відгук тут..."></textarea>
    </div>

    <button type="submit">Додати коментар</button>
</form>

<div style="margin-top: 30px;">
    <a th:href="@{/books}" th:text="#{back.to.books}">Back</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
