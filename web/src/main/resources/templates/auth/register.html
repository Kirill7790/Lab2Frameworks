<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; }
        .error { color: #b00020; margin-bottom: 12px; }
        .links { margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

<h2>Реєстрація</h2>

<div class="error" th:if="${error}" th:text="${error}">Помилка</div>

<form th:action="@{/register}" method="post">
    <div class="form-group">
        <label for="username">Логін</label>
        <input type="text" id="username" name="username" th:value="${username}" required/>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:value="${email}" required/>
    </div>
    <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required minlength="4"/>
    </div>
    <button type="submit">Зареєструватися</button>
</form>

<div class="links">
    <a th:href="@{/login}">Уже маю акаунт — увійти</a>
</div>

</body>
</html>
