<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title th:text="#{form.add}">Add book</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; margin-top: 3px; }
        .alert { padding: 10px; background: #ffe0e0; border: 1px solid #e00;
                 color: #900; margin-bottom: 15px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h2 th:text="#{form.add}">Add book</h2>

<div th:if="${error}" class="alert" th:text="${error}">Error</div>

<form th:action="@{/books/add}" th:object="${book}" method="post">

    <div class="form-group">
        <label for="title" th:text="#{form.title}">Title</label>
        <input type="text" id="title" th:field="*{title}" required/>
        <div class="error" th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}">Title error</div>
    </div>

    <div class="form-group">
        <label for="author" th:text="#{form.author}">Author</label>
        <input type="text" id="author" th:field="*{author}" required/>
        <div class="error" th:if="${#fields.hasErrors('author')}"
             th:errors="*{author}">Author error</div>
    </div>

    <div class="form-group">
        <label for="year">Рік видання</label>
        <input type="number" th:field="*{year}" placeholder="Наприклад, 2023"/>
    </div>

    <button type="submit" th:text="#{form.submit}">Save</button>
    <a th:href="@{/books}" th:text="#{form.cancel}">Cancel</a>
</form>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
